name: Nightly Release

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch_tag }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_tag: amd64
            runner: ubuntu-latest
            asset: usque-linux-amd64
          - arch_tag: arm64
            runner: ubuntu-24.04-arm
            asset: usque-linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: rui314/setup-mold@v1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang perl

      - name: Build
        run: cargo build --release --locked -p usque-cli

      - name: Rename binary
        run: cp target/release/usque ${{ matrix.asset }}

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Nightly Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Delete existing nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete nightly --yes --cleanup-tag || true

      - name: Create nightly release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: nightly
          name: Nightly
          body: |
            Automated nightly build from `main` (commit ${{ github.sha }}).
          prerelease: true
          make_latest: true
          files: dist/*
